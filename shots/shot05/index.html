<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI × Edu — Shot 05</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="review-shell">
    <section id="animation-frame" class="animation-frame" aria-label="Shot 05 animation">
      <svg id="scene" viewBox="0 0 1600 900" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">Two tapered hairs holding confined liquid</title>
        <desc id="scene-desc">A continuous researcher sketch showing attention shift from tip size to the gap and confined liquid.</desc>
        <defs>
          <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="19" result="noise"/>
            <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
            <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.055"/></feComponentTransfer>
          </filter>
          <clipPath id="liquid-reveal"><rect id="liquid-clip" x="90" y="176" width="120" height="0"/></clipPath>
        </defs>
        <rect class="paper" width="1600" height="900"/>
        <rect class="paper-noise" width="1600" height="900"/>
        <g id="debug-guides" aria-hidden="true"><path d="M800 0V900M0 450H1600"/><rect x="80" y="60" width="1440" height="760"/></g>

        <g id="main-diagram">
          <path class="substrate sketch-line" d="M-190 655 C40 651 280 657 500 653"/>
          <g id="liquid" clip-path="url(#liquid-reveal)">
            <path class="liquid-fill" d="M99 176 C119 215 178 215 201 176 L210 528 L90 528 Z"/>
            <path class="liquid-edge" d="M99 176 C119 215 178 215 201 176"/>
            <path class="liquid-pencil" d="M112 262l25-18m-14 93l35-26m-31 105l38-28m-47 96l30-22"/>
          </g>
          <path class="hair" d="M88 528 C60 443 65 294 96 72 C123 202 146 360 129 491 C124 526 110 546 88 528 Z"/>
          <path class="hair-shade" d="M92 505 C80 400 85 252 97 104 C111 250 122 397 112 504"/>
          <path class="hair" d="M212 528 C190 546 176 526 171 491 C154 360 177 202 204 72 C235 294 240 443 212 528 Z"/>
          <path class="hair-shade" d="M188 504 C178 397 189 250 203 104 C215 252 220 400 208 505"/>
          <path id="attention-circle" class="draw-path accent-pencil" pathLength="1" d="M155 92 C68 91 29 179 35 306 C42 444 91 564 163 558 C237 550 273 438 267 302 C261 170 233 90 155 92 Z"/>
          <path id="gap-bracket" class="draw-path sketch-line" pathLength="1" d="M238 220 h38 v222 h-38 M276 330 h28"/>
        </g>

        <g id="tip-diagram" class="annotation-group">
          <path id="tip-lines" class="draw-path sketch-line" pathLength="1" d="M32 260 L92 36 L145 260 Z M18 270h140 M25 10v42 M151 10v42 M25 25h126 m-126 0l13-8m-13 8l13 8m113-8l-13-8m13 8l-13 8"/>
          <text id="tip-label" class="sketch-text" x="176" y="35">tip size</text>
          <path id="cross-one" class="draw-path cross" pathLength="1" d="M8 44 C59 91 105 140 163 205"/>
          <path id="cross-two" class="draw-path cross" pathLength="1" d="M161 49 C113 92 65 146 16 211"/>
        </g>

        <g id="gap-annotation" class="annotation-group">
          <text id="gap-label" class="annotation-title" x="0" y="0">GAP</text>
          <text id="gap-cn" class="annotation-cn" x="3" y="42">间隙</text>
        </g>
        <g id="bridge-annotation" class="annotation-group">
          <path id="bridge-pointer" class="draw-path sketch-line" pathLength="1" d="M0 0 C-80 50 -165 50 -255 -12"/>
          <text id="bridge-label" class="annotation-title" x="22" y="12">LIQUID BRIDGE</text>
          <text id="bridge-cn" class="annotation-cn" x="25" y="54">液桥</text>
        </g>
        <foreignObject id="subtitle-layer" x="180" y="765" width="1240" height="80">
          <div id="subtitle" xmlns="http://www.w3.org/1999/xhtml"></div>
        </foreignObject>
      </svg>
    </section>

    <section class="controls" aria-label="Development controls">
      <div class="button-row">
        <button id="play" type="button">Play</button><button id="pause" type="button">Pause</button><button id="restart" type="button">Restart</button>
        <output id="time-display">0:00 / 0:15</output>
      </div>
      <input id="scrubber" type="range" min="0" max="15" step="0.01" value="0" aria-label="Local shot time">
      <label><input id="subtitle-toggle" type="checkbox" checked> Subtitles</label>
      <label><input id="debug-toggle" type="checkbox"> Debug guides</label>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="timeline.js"></script>
</body>
</html>
